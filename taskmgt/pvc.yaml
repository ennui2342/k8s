# Static Retain PV — the tm task store (SQLite) must never sit on the
# nfs-client StorageClass's dynamic Delete policy (archiveOnDelete: false),
# where deleting the PVC deletes the NAS directory. See CLAUDE.md "Per-app
# Kustomizations" and LINT.md's storage-durability rule.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: taskmgt-data-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: taskmgt-data
    namespace: taskmgt
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  volumeMode: Filesystem
  nfs:
    path: /mnt/md0/k8s/taskmgt-data
    server: 192.168.0.76
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskmgt-data
  namespace: taskmgt
spec:
  volumeName: taskmgt-data-pv
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

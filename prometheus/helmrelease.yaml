apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Injects the discord-webhook secret's plaintext value directly into the
  # rendered Helm values at deploy time — this Alertmanager version's
  # discord_configs doesn't support webhook_url_file (confirmed live
  # 2026-07-27: "field webhook_url_file not found in type
  # alertmanager.discordConfig", failing every operator reconcile since,
  # silently leaving the pod on a stale pre-Discord config), only the plain
  # webhook_url field, which can't itself be a file path — so the value has
  # to be merged in from the secret rather than referenced by mounted path.
  valuesFrom:
    - kind: Secret
      name: discord-webhook
      valuesKey: address
      targetPath: alertmanager.config.receivers[1].discord_configs[0].webhook_url
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pinned to the current minor line, not a wide "70.x.x" range - this chart
      # has a real history of breaking changes between minor versions (CRD schema
      # shifts for PrometheusRule/ServiceMonitor especially), and it's the
      # monitoring backbone every alert/task-creation mechanism in this repo
      # depends on. Confirmed live 2026-07-30, same class of risk as cert-manager
      # (see that HelmRelease's comment) - patch releases still auto-apply within
      # this line; a minor/major bump needs a deliberate, reviewed pass.
      version: "70.10.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:

    # --- Grafana ---
    grafana:
      image:
        # 11.6.16 is the newest tag on the 11.6.x line (grafana has moved on
        # to 12.x/13.x, a major-version jump out of scope for a routine CVE
        # pass). Locally patched instead: Alpine 3.24.1 base's c-ares/curl
        # had fixes already published in the same Alpine 3.24 repos, so a
        # same-base-version apk upgrade resolves all 9 HIGH CVEs
        # (c-ares 1.34.6->1.34.8-r0, curl/libcurl 8.20.0->8.21.0-r0) without
        # a grafana version change. See trivy/patched-images.yaml and
        # trivy/patched-images/grafana/Dockerfile.
        registry: "127.0.0.1:30500"
        repository: "grafana"
        tag: "11.6.16-patched"
        pullPolicy: IfNotPresent

      downloadDashboardsImage:
        # curlimages/curl:8.20.0 (Alpine 3.24.1) carried 5 HIGH CVEs
        # (c-ares CVE-2026-33630, openssl CVE-2026-45447, libssh2
        # CVE-2026-55199/CVE-2026-55200/CVE-2026-7598). Plain upstream
        # 8.21.0 fixes openssl/libssh2 but still ships c-ares 1.34.6-r0,
        # not the fixed 1.34.8-r0 (verified live) — same gap the grafana
        # image hit one day earlier on the same Alpine 3.24.1 base.
        # Locally patched: same-base-version apk upgrade closes it. See
        # trivy/patched-images.yaml and
        # trivy/patched-images/curlimages-curl/Dockerfile.
        registry: "127.0.0.1:30500"
        repository: "curlimages-curl"
        tag: "8.21.0-patched"
        pullPolicy: IfNotPresent

      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      grafana.ini:
        analytics:
          check_for_updates: true
        auth.anonymous:
          enabled: true
          org_role: Viewer
        panels:
          disable_sanitize_html: true
        security:
          allow_embedding: true

      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.k8s.ecafe.org

      persistence:
        enabled: true
        storageClassName: nfs-client
        size: 10Gi

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

      # Watch all namespaces for ConfigMaps labelled grafana_dashboard: "1"
      sidecar:
        image:
          tag: "1.30.9"
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"

      # Community dashboards downloaded from grafana.com at deploy time
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default

      dashboards:
        default:
          loki:
            gnetId: 14055
            revision: 5
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
              - name: DS_LOKI
                value: Loki
          nfs:
            gnetId: 6257
            revision: 1
            datasource: Prometheus

      additionalDataSources:
        - name: InfluxDB
          type: influxdb
          access: proxy
          url: http://influxdb.monitoring.svc:8086
          database: telegraf
          uid: Kb3eTeiRk
          editable: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc:3100
          uid: loki
          editable: true

    # --- Prometheus ---
    prometheus:
      prometheusSpec:
        retention: 31d
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

        # Widened probe timeouts/thresholds on the operator-generated
        # "prometheus" container (strategic-merge patch - the Prometheus CRD's
        # supported escape hatch for this, see `kubectl explain
        # prometheus.spec.containers`; there's no dedicated probe-tuning field).
        # Added 2026-08-22: after a full cluster hard-reboot, k8s-1's load
        # stayed pinned at ~19-20 for 2+ hours in a self-reinforcing restart
        # loop - kubelet's default 3s HTTP liveness/readiness probes kept
        # timing out ("context deadline exceeded") purely from node overload,
        # kubelet killed an otherwise-healthy Prometheus, and each restart's
        # WAL replay/compaction (expensive on this node's NFS-backed storage)
        # added more load, making the real cause worse. Same night, same
        # symptom, same node hit opsimath-db's Postgres via exec probes - see
        # opsimath/postgres.yaml's matching comment. 15s/threshold 10 gives
        # real headroom without masking a genuinely wedged Prometheus.
        containers:
          - name: prometheus
            livenessProbe:
              timeoutSeconds: 15
              failureThreshold: 10
            readinessProbe:
              timeoutSeconds: 15
              failureThreshold: 10

    # --- Alertmanager ---
    alertmanager:
      alertmanagerSpec:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist

      config:
        global:
          resolve_timeout: 5m

        route:
          group_by: ['alertname', 'namespace']
          group_wait: 1m        # wait 1m to batch related alerts before sending
          group_interval: 5m    # wait 5m before sending updates to an existing group
          repeat_interval: 4h   # re-notify after 4h if still firing
          receiver: discord
          routes:
            - matchers:
                - alertname="Watchdog"
              receiver: "null"  # suppress the heartbeat alert

        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url: ""  # overwritten at deploy time by spec.valuesFrom above
                send_resolved: true

        inhibit_rules:
          # Standard: critical suppresses warning/info for same alert in same namespace
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity=~"warning|info"
            equal: [alertname, namespace]
          - source_matchers:
              - severity="warning"
            target_matchers:
              - severity="info"
            equal: [alertname, namespace]
          # Root cause: high iowait (storage/NFS saturation) suppresses downstream
          # pod-level symptoms that are consequences, not independent problems
          - source_matchers:
              - alertname="NodeHighIOWait"
            target_matchers:
              - alertname=~"KubePodCrashLooping|KubePodNotReady|KubeDeploymentReplicasMismatch"
          # Our own consolidated (one-alert-for-the-whole-share) PersistentVolumeFillingUp
          # supersedes the default per-PVC rules, which would otherwise fire once per PVC
          # for the exact same underlying NFS export (confirmed live 2026-07-27: 23
          # near-simultaneous alerts for one real problem). No `equal` needed — our alert
          # has no per-PVC labels to match against, it's meant to suppress unconditionally
          # whenever it's firing.
          - source_matchers:
              - alertname="PersistentVolumeFillingUp"
            target_matchers:
              - alertname=~"KubePersistentVolumeFillingUp|KubePersistentVolumeInodesFillingUp"

    # --- node-exporter ---
    # Must run on all nodes including master to collect control-plane metrics
    prometheus-node-exporter:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    # --- kube-state-metrics ---
    kube-state-metrics:
      collectors:
        - cronjobs
        - daemonsets
        - deployments
        - endpoints
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - leases
        - namespaces
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - pods
        - replicasets
        - replicationcontrollers
        - services
        - statefulsets
        - storageclasses
      livenessProbe:
        initialDelaySeconds: 30
        failureThreshold: 12
        periodSeconds: 15
      readinessProbe:
        initialDelaySeconds: 30
        failureThreshold: 12
        periodSeconds: 15
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    # --- node-exporter OS dashboards ---
    # These nodes are Linux/ARM64 only
    nodeExporter:
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    # --- k3s compatibility ---
    # These components are not accessible via standard endpoints in k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: storage
      interval: 1m
      rules:
        # Thresholds calibrated for this cluster's actual hardware, not generic
        # server defaults — k8s-1/k8s-2 are Pi-class nodes on eMMC/SD storage,
        # not SSD/NVMe. Confirmed live 2026-07-27: a real fix (CronJobs no
        # longer reinstalling packages every run, see the k8s-toolbox principle
        # below) brought peak iowait on k8s-2 down from 35% to a 13-16% band
        # that's just normal for ~40 pods sharing one eMMC card — the old 10%
        # threshold fired continuously on that new, harmless baseline. Per this
        # repo's own alert-needs-a-task principle: if we're not going to act on
        # an alert, it shouldn't fire — 20% leaves real margin above the normal
        # band while still well under the 30% critical threshold.
        - alert: NodeHighIOWait
          expr: |
            avg by (instance) (
              rate(node_cpu_seconds_total{mode="iowait", job="node-exporter"}[5m])
            ) * 100 > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High I/O wait on {{ $labels.instance }}
            description: >-
              Average iowait is {{ $value | printf "%.1f" }}% on {{ $labels.instance }}.
              Check both the local node disk (confirmed the actual cause once —
              node_disk_io_time_seconds_total per device) and NFS/NAS load; don't
              assume it's the NAS without checking, the physical NAS array can be
              nearly idle while a node's own local disk is saturated.

        - alert: NodeCriticalIOWait
          expr: |
            avg by (instance) (
              rate(node_cpu_seconds_total{mode="iowait", job="node-exporter"}[5m])
            ) * 100 > 30
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Critical I/O wait on {{ $labels.instance }}
            description: >-
              Average iowait is {{ $value | printf "%.1f" }}% on {{ $labels.instance }}.
              Check both the local node disk and NFS/NAS load — see NodeHighIOWait's
              annotation for why not to assume it's the NAS.

        # Every PVC on the nfs-client StorageClass is a subdirectory of the
        # same underlying NFS export (192.168.0.76:/mnt/md0/k8s) — confirmed
        # live 2026-07-27: every PVC across every namespace reports
        # identical available/capacity bytes (differing only by scrape-time
        # noise), since subdir provisioning has no real per-PVC quota. The
        # un-aggregated version of this query fired once per PVC (23 near-
        # simultaneous alerts) for what is really one problem — max() here
        # collapses every PVC's identical series into a single alert.
        - alert: PersistentVolumeFillingUp
          expr: |
            max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Shared NFS storage (nfs-client) is {{ $value | humanizePercentage }} full
            description: >-
              All nfs-client PVCs share one underlying export
              (192.168.0.76:/mnt/md0/k8s), now {{ $value | humanizePercentage }}
              full. This fires once for the whole share, not per-PVC — check
              the NAS directly, expanding or pruning any single PVC won't help.

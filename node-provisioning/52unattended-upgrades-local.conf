// Host-local override for automatic security-update reboots — NOT GitOps-managed,
// same category as master-backup/k3s-backup.sh and the containerd registry trust
// config (see RUNBOOK.md Phase 0/CLAUDE.md's registry section): outside k8s's own
// object model entirely, must be deployed by hand to /etc/apt/apt.conf.d/ on every
// node (master + all workers).
//
// A separate drop-in rather than editing Ubuntu's own shipped
// /etc/apt/apt.conf.d/50unattended-upgrades directly — apt.conf.d files are read in
// lexical order with later files overriding earlier keys, so this survives a package
// update to unattended-upgrades itself re-shipping its default file untouched.
//
// Added 2026-08-23: unattended-upgrades was already installing security patches
// automatically (confirmed live rebuilding all four nodes the same week — a fresh
// image pulled ~90 packages including the kernel, completely unprompted), but
// Automatic-Reboot defaulted to false, so a patch that needed a reboot (e.g. any
// kernel update) sat installed-but-inactive indefinitely. Confirmed live: at the time
// this was added, master and k8s-1 both already had a reboot pending from earlier
// that same night with no reboot ever scheduled to happen.
//
// Window: 04:15 daily. Clears master's own backup cron (master-backup/k3s-backup.sh,
// 03:30, done in well under a minute) and both of the agent-orchestrator's dispatch
// windows (01:00, 06:00 — see CLAUDE.md's CVE Patch Management section) with room to
// spare on both sides; sits *before* apt-daily-upgrade.timer's own ~06:00 (±60min
// jitter) run, so each night's reboot cleanly picks up whatever the *previous* day's
// upgrade flagged — a one-day lag between "patch installed" and "patch active" in the
// worst case, which is expected, not a bug. Any new node-local CronJob/cron entry
// should avoid 04:00–04:30 to leave headroom around this.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:15";

// Host-local override for automatic security-update reboots — NOT GitOps-managed,
// same category as master-backup/k3s-backup.sh and the containerd registry trust
// config (see RUNBOOK.md Phase 0/CLAUDE.md's registry section): outside k8s's own
// object model entirely, must be deployed by hand to /etc/apt/apt.conf.d/ on every
// node (master + all workers).
//
// A separate drop-in rather than editing Ubuntu's own shipped
// /etc/apt/apt.conf.d/50unattended-upgrades directly — apt.conf.d files are read in
// lexical order with later files overriding earlier keys, so this survives a package
// update to unattended-upgrades itself re-shipping its default file untouched.
//
// Added 2026-08-23: unattended-upgrades was already installing security patches
// automatically (confirmed live rebuilding all four nodes the same week — a fresh
// image pulled ~90 packages including the kernel, completely unprompted), but
// Automatic-Reboot defaulted to false, so a patch that needed a reboot (e.g. any
// kernel update) sat installed-but-inactive indefinitely. Confirmed live: at the time
// this was added, master and k8s-1 both already had a reboot pending from earlier
// that same night with no reboot ever scheduled to happen.
//
// STAGGERED per node, not a single shared time — every node runs the identical OS
// image, so a kernel/security update needing a reboot lands on all four within the
// same day or two almost always. A single shared reboot time would mean master and
// every worker going down at the exact same instant with zero cross-node awareness
// (Automatic-Reboot-Time has no concept of "wait for the other node to come back" -
// it's a dumb per-node timer). That's a smaller-scale echo of the exact "whole
// cluster dark at once" problem this fleet spent 2026-08-19 through -22 dealing with,
// even though a routine reboot is much lower-risk than that rebuild was (local
// container image caches survive a reboot, so it doesn't recreate the empty-cache/
// single-registry bottleneck that caused most of that pain - this is specifically
// about not lightly reintroducing "everything down simultaneously" as a *new*
// self-inflicted risk).
//
// Master reboots first (04:15) so it's back up and stable before any worker needs
// to rejoin it, rather than workers finishing their own reboot and hammering a
// still-rebooting API server. Workers staggered 15min apart after that - comfortably
// more than the ~1-3min a Pi actually takes to reboot and have k3s-agent reconnect,
// confirmed live during tonight's rebuild. This file is IDENTICAL except for the one
// Automatic-Reboot-Time line - deploy the matching value per node, don't copy the
// same file everywhere.
//
// Full window: 04:15 (master) - 05:00 (k8s-3), done by ~05:05 in practice. Clears
// master's own backup cron (03:30, done in well under a minute) and both of the
// agent-orchestrator's dispatch windows (01:00, 06:00 - see CLAUDE.md's CVE Patch
// Management section) with room to spare on both sides, and sits before apt-daily-
// upgrade.timer's own ~06:00 (+-60min jitter) run, so each reboot cleanly picks up
// whatever the *previous* day's upgrade flagged - a one-day lag between "patch
// installed" and "patch active" in the worst case, expected, not a bug. Any new
// node-local CronJob/cron entry should avoid 04:00-05:15 to leave headroom.
//
// Per-node value actually deployed (this copy: MASTER — change before deploying to
// a worker):
//   master (k8s)  04:15
//   k8s-1         04:30
//   k8s-2         04:45
//   k8s-3         05:00
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:15";

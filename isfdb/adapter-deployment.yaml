apiVersion: v1
kind: Service
metadata:
  name: isfdb-adapter
  namespace: isfdb
spec:
  type: ClusterIP
  selector:
    app: isfdb-adapter
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isfdb-adapter
  namespace: isfdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isfdb-adapter
  template:
    metadata:
      labels:
        app: isfdb-adapter
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: isfdb-adapter
          image: 127.0.0.1:30500/isfdb-mirror:1.20260810.2232
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: isfdb-db
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: isfdb-secrets
                  key: MARIADB_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

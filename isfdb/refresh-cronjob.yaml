# ISFDB publishes a new "5.5-compatible" MySQL backup every Saturday.
# Sunday 08:00 UTC gives a buffer after that. A failed run is safe — the
# atomic swap in refresh.py only happens after the staging import passes
# its row-count sanity check, so last week's data stays live on failure.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: isfdb-refresh
  namespace: isfdb
spec:
  schedule: "0 8 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # NFS-backed MariaDB import of the ~1.6GB uncompressed dump routinely
      # takes 25-30+ minutes on its own (observed empirically) — this isn't
      # a bug, just NFS write latency at this data volume. Generous budget.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: isfdb-refresh
              image: 127.0.0.1:30500/isfdb-mirror:1.20260727.2341
              imagePullPolicy: IfNotPresent
              command: ["python", "refresh.py"]
              env:
                - name: DB_HOST
                  value: isfdb-db
              envFrom:
                - secretRef:
                    name: isfdb-secrets
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 512Mi

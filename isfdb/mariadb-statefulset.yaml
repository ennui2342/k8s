apiVersion: v1
kind: Service
metadata:
  name: isfdb-db
  namespace: isfdb
spec:
  clusterIP: None
  selector:
    app: isfdb-db
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: isfdb-db
  namespace: isfdb
spec:
  serviceName: isfdb-db
  replicas: 1
  selector:
    matchLabels:
      app: isfdb-db
  template:
    metadata:
      labels:
        app: isfdb-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: isfdb-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: isfdb
          args:
            - --max_allowed_packet=256M
            - --key_buffer_size=1200M
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # Re-warms both cache layers (MyISAM key buffer + OS/NFS page
          # cache) on every container start, not just after the weekly
          # isfdb-refresh CronJob (which does the same warm-up itself, see
          # isfdb-adapter's refresh.py warm_caches()) — a pod restart for
          # any other reason (CVE image patch, node maintenance, manual
          # rollout restart) would otherwise leave searches cold until the
          # following Sunday. Waits for the server to accept connections
          # first since postStart fires as soon as the container process
          # starts, not once mariadbd is actually ready. `|| true` at the
          # end is required for a fresh cluster's first-ever start, before
          # any refresh has run and these tables exist yet — postStart
          # failing would otherwise block/crash the container.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD" >/dev/null 2>&1 && break
                      sleep 2
                    done
                    mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -e "
                      LOAD INDEX INTO CACHE isfdb.titles, isfdb.authors, isfdb.canonical_author, isfdb.pubs, isfdb.pub_content;
                      SELECT COUNT(*) FROM isfdb.titles WHERE title_id >= 0;
                      SELECT COUNT(*) FROM isfdb.authors WHERE author_id >= 0;
                      SELECT COUNT(*) FROM isfdb.canonical_author WHERE title_id >= 0;
                      SELECT COUNT(*) FROM isfdb.pubs WHERE pub_id >= 0;
                      SELECT COUNT(*) FROM isfdb.pub_content WHERE pub_id >= 0;
                    " || true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 20Gi

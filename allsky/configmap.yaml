# Non-secret env for gunicorn, the expire CronJob and MariaDB (upstream
# docker/env_template at indi-allsky 56910616). Secrets (DB passwords, Flask
# SECRET_KEY/PASSWORD_KEY, first web user's password) are in
# allsky-secret.yaml. TZ is baked into the image (Europe/London).
apiVersion: v1
kind: ConfigMap
metadata:
  name: allsky-config
  namespace: allsky
data:
  INDIALLSKY_IMAGE_FOLDER: /var/www/html/allsky/images
  INDIALLSKY_FLASK_AUTH_ALL_VIEWS: "false"
  INDIALLSKY_MARIADB_HOST: allsky-db.allsky.svc.cluster.local
  INDIALLSKY_MARIADB_PORT: "3306"
  INDIALLSKY_MARIADB_SSL: "false"
  INDIALLSKY_MARIADB_CHARSET: utf8mb4
  INDIALLSKY_MARIADB_COLLATION: utf8mb4_unicode_ci
  MARIADB_DATABASE: indi_allsky
  MARIADB_USER: indi_allsky_own
  # First admin user, created by start_gunicorn.sh only when the DB has no
  # real users yet. Password is INDIALLSKY_WEB_PASS in allsky-secrets.
  INDIALLSKY_WEB_USER: ennui2342
  INDIALLSKY_WEB_NAME: Mark Cheverton
  INDIALLSKY_WEB_EMAIL: mark.cheverton@ecafe.org
  INDIALLSKY_WEB_GENERATE_APIKEY: "false"
  # gunicorn: trust X-Forwarded-* from the nginx sidecar (upstream default).
  FORWARDED_ALLOW_IPS: "*"
---
# nginx sidecar config: upstream docker/nginx.local.conf at 56910616, but
# plain HTTP on :80 (Traefik terminates TLS, so the :8443 redirect and ssl
# lines are gone), gunicorn on localhost, and no /indi-allsky/static block
# (that folder only exists in the gunicorn image; Flask's blueprint serves
# /indi-allsky/static itself through the proxy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: allsky-nginx
  namespace: allsky
data:
  default.conf: |
    server {
        listen 80;

        root /var/www/html/allsky;

        # Relative Location headers, so a redirect keeps the client's scheme
        # (nginx only sees plain HTTP from Traefik).
        absolute_redirect off;
        rewrite ^/$ /indi-allsky/ redirect;

        # The Pi uploads timelapse videos of ~50 MB over SyncAPI.
        client_max_body_size 1024M;

        location /indi-allsky/images {
            alias /var/www/html/allsky/images;
            autoindex off;

            location ~* \.(jpe?g|png|tiff?|bmp|gif|fits?|webp|jp2|mp4|webm)$ {
                expires 90d;
                add_header Pragma public;
                add_header Cache-Control "public";
            }
        }

        location /indi-allsky {
            try_files $uri @proxy_to_indi_allsky;
        }

        proxy_read_timeout 600s;

        location @proxy_to_indi_allsky {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

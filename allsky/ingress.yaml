# Internal only (LAN/Tailscale Split DNS): default web + websecure entry
# points, no TLS cert (*.k8s.ecafe.org is internal DNS, see CLAUDE.md). The
# camera Pi uploads to https://allsky.k8s.ecafe.org/indi-allsky with
# certificate verification off (Traefik's default cert). Not on the
# public/publictls entry points: the public, read-only gallery is
# zephyr.ecafe.org (public-ingressroute.yaml), and login/SyncAPI stay here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: allsky-web
  namespace: allsky
spec:
  ingressClassName: traefik
  rules:
    - host: allsky.k8s.ecafe.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: allsky-web
                port:
                  number: 80

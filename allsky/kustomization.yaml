apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pv.yaml
  - configmap.yaml
  - allsky-secret.yaml
  - mariadb.yaml
  - web-deployment.yaml
  - expire-cronjob.yaml
  - meteors-cronjob.yaml
  - ingress.yaml
  - certificate.yaml
  - public-ingressroute.yaml
# Public landing page for https://zephyr.ecafe.org/ (tm c2ac591f), served by
# the allsky-web nginx sidecar at `location = /`. Master copy lives in
# ~/projects/allsky/zephyr-site/index.html; changes come as new tasks.
# Hash suffix kept on purpose: a new index.html rolls the pod by itself.
configMapGenerator:
  - name: zephyr-site
    namespace: allsky
    files:
      - zephyr-site/index.html
# allsky-meteors camera settings + detection mask (binaryData). Master copy
# in ~/projects/allsky/meteors-deploy/. Hash suffix: a change applies to the
# next CronJob run.
  - name: allsky-meteors-config
    namespace: allsky
    files:
      - meteors-config/meteors.json
      - meteors-config/detect_mask.png

# indi-allsky web/SyncAPI receiver: the camera Pi (indi-allsky.local) uploads
# every image, panorama, timelapse, keogram and star trail here. Mirrors
# upstream docker-compose's gunicorn + webserver services as one pod:
#   - gunicorn: ghcr.io/ennui2342/indi-allsky-web (upstream
#     docker/Dockerfile.gunicorn at the indi-allsky commit the Pi runs, plus
#     expire.sh; source github.com/ennui2342/indi-allsky-web). Keep the tag on
#     the same upstream commit as the Pi, see that repo's README.
#   - nginx sidecar: serves the image folder statically, proxies the rest.
# One replica, Recreate: start_gunicorn.sh runs Flask-Migrate against a
# single migrations folder on every start, two pods must never race on it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allsky-web
  namespace: allsky
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: allsky-web
  template:
    metadata:
      labels:
        app: allsky-web
      annotations:
        # Bump when configmap.yaml changes; Flux won't restart pods itself.
        checksum/config: "20261118-1"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        # Container user allsky is uid/gid 10001.
        fsGroup: 10001
      containers:
        - name: gunicorn
          image: ghcr.io/ennui2342/indi-allsky-web:1.20261118.2
          imagePullPolicy: IfNotPresent
          # No runAsUser/allowPrivilegeEscalation override: start_gunicorn.sh
          # runs `sudo chown allsky:allsky` on /etc/indi-allsky and
          # /var/lib/indi-allsky (passwordless sudo inside the image), and
          # exits under errexit if sudo can't escalate.
          envFrom:
            - configMapRef:
                name: allsky-config
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: allsky-secrets
                  key: MARIADB_PASSWORD
            - name: INDIALLSKY_FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: allsky-secrets
                  key: INDIALLSKY_FLASK_SECRET_KEY
            # Encrypts stored secrets (API keys) in the DB: must never change.
            - name: INDIALLSKY_FLASK_PASSWORD_KEY
              valueFrom:
                secretKeyRef:
                  name: allsky-secrets
                  key: INDIALLSKY_FLASK_PASSWORD_KEY
            - name: INDIALLSKY_WEB_PASS
              valueFrom:
                secretKeyRef:
                  name: allsky-secrets
                  key: INDIALLSKY_WEB_PASS
          ports:
            - containerPort: 8000
              name: gunicorn
          volumeMounts:
            - name: images
              mountPath: /var/www/html/allsky
            - name: state
              mountPath: /var/lib/indi-allsky
            - name: etc
              mountPath: /etc/indi-allsky
          # start_gunicorn.sh sleeps ~60s "waiting on database", then runs
          # migrations before gunicorn binds :8000. Allow up to 10 minutes.
          startupProbe:
            httpGet:
              path: /indi-allsky/
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /indi-allsky/
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        - name: nginx
          image: 127.0.0.1:30500/nginx:1.31.3-trixie-patched
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: images
              mountPath: /var/www/html/allsky
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /indi-allsky/
              port: 80
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: allsky-images
        - name: state
          persistentVolumeClaim:
            claimName: allsky-state
        # Regenerated (flask.json) on every start.
        - name: etc
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: allsky-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: allsky-web
  namespace: allsky
spec:
  selector:
    app: allsky-web
  ports:
    - name: http
      port: 80
      targetPort: 80

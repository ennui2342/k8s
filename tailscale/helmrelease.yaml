apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tailscale-operator
      # Pinned to the current minor line, not a wide "1.x.x" range - see
      # cert-manager/helmrelease.yaml's comment for why (confirmed live 2026-07-30).
      version: "1.98.x"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  valuesFrom:
    - kind: Secret
      name: operator-oauth
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: operator-oauth
      valuesKey: client_secret
      targetPath: oauth.clientSecret
  values:
    operatorConfig:
      defaultTags:
        - "tag:k8s"
      # Locally-patched fork of tailscale/k8s-operator:v1.98.9 — same-tag
      # frozen-rebuild resolving CVE-2026-14456 (HIGH, openssl QUIC-server DoS)
      # by bumping libcrypto3/libssl3 3.5.7-r0 -> 3.5.8-r0. v1.98.9 is the
      # newest release in the pinned 1.98.x chart line and the next line
      # (1.102.x) still ships the vulnerable openssl, so a version bump fixes
      # nothing here. Served from the in-cluster registry; tracked in
      # trivy/patched-images.yaml. Revert to the plain chart image once
      # upstream ships openssl >= 3.5.8-r0 (reconcile-scanner watches this).
      image:
        repository: 127.0.0.1:30500/k8s-operator
        tag: v1.98.9-patched
        pullPolicy: IfNotPresent
    proxyConfig:
      # Locally-patched fork of tailscale/tailscale:v1.98.9 — the image the
      # operator injects (via PROXY_IMAGE) into every proxy StatefulSet it
      # creates (ingress/egress/Connector/Funnel). Same-tag frozen-rebuild
      # resolving the same CVE-2026-14456 (HIGH, openssl QUIC-server DoS) as the
      # operator image above, by bumping libcrypto3/libssl3 3.5.7-r0 -> 3.5.8-r0.
      # v1.98.9 is the newest release in the pinned 1.98.x chart line and the
      # next line (1.102.x) still ships the vulnerable openssl, so a version bump
      # fixes nothing here. Served from the in-cluster registry; tracked in
      # trivy/patched-images.yaml. Revert to the plain chart image once upstream
      # ships openssl >= 3.5.8-r0 (reconcile-scanner watches this).
      # Note: the operator hardcodes imagePullPolicy: Always on proxy pods and
      # only a ProxyClass can override it — acceptable here since the registry
      # is in-cluster.
      image:
        repository: 127.0.0.1:30500/tailscale
        tag: v1.98.9-patched

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: loki
      # Pinned to the current minor line, not a wide "6.x.x" range - see
      # cert-manager/helmrelease.yaml's comment for why (confirmed live 2026-07-30).
      version: "6.55.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
        compaction_interval: 10m
        retention_delete_delay: 2h
      limits_config:
        retention_period: 744h   # 31 days

    singleBinary:
      replicas: 1
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      persistence:
        enabled: true
        storageClass: nfs-client
        size: 10Gi

    # Disable distributed-mode components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # Pin k8s-sidecar ahead of the Loki chart default for Alpine-base CVEs. History:
    # CVE-2025-15467 / CVE-2026-31789 (Alpine 3.23 era), then 2026-08-14 -> 2.8.2 for
    # CVE-2026-45447 (openssl PKCS7_verify UAF). 2026-09-06 -> 2.11.2 for CVE-2026-14456
    # (HIGH: openssl DoS via unbounded memory growth in the QUIC server). Those were all
    # handled by plain upstream tag bumps. 2026-09-18: 2.11.2 flagged for 6 HIGH util-linux
    # CVEs (CVE-2026-53612/53613/53614/76642/78408/78410, fixed at 2.41.6-r0/-r1) — but
    # 2.11.2 is already the newest upstream tag (confirmed via Docker Hub tags API) and its
    # digest is unchanged since 2026-09-04, so no plain tag bump can pick this up. Only the
    # `libuuid` subpackage of util-linux is actually installed in this image (no
    # mount/nsenter binaries present — verified via `apk info` in the base image), but
    # Alpine's util-linux source package versions all its subpackages together, so bumping
    # libuuid to the fixed 2.41.6-r1 (published in the alpine v3.22/main repo) resolves all
    # six advisories. Now a local frozen-rebuild fork — see trivy/patched-images.yaml and
    # trivy/patched-images/k8s-sidecar/Dockerfile (plain `apk upgrade` on the same 2.11.2 /
    # Alpine 3.22.4 base, sidecar app/entrypoint untouched, no config or behaviour change).
    sidecar:
      image:
        registry: "127.0.0.1:30500"
        repository: "k8s-sidecar"
        tag: "2.11.2-patched"
        pullPolicy: IfNotPresent

    # Disable extras not needed for single-binary homelab
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: promtail
      # Pinned to the current minor line, not a wide "6.x.x" range - see
      # cert-manager/helmrelease.yaml's comment for why (confirmed live 2026-07-30).
      version: "6.17.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    # Promtail is fully EOL upstream (deprecated in favor of Grafana Alloy,
    # commercial support ended 2026-02-28); grafana/promtail:3.6.11
    # (published 2026-05-13) is the last image Grafana will ever publish for
    # it, and the grafana/helm-charts `promtail` chart hasn't had a release
    # since 6.17.1 (still appVersion 3.5.1) - so this stays on chart 6.17.x
    # but overrides the image to a locally-rebuilt tag that closes the
    # residual openssl CVE plain 3.6.11 still ships. See
    # trivy/patched-images.yaml and trivy/patched-images/promtail/Dockerfile.
    image:
      registry: "127.0.0.1:30500"
      repository: "promtail"
      tag: "3.6.11-patched"
      pullPolicy: IfNotPresent

    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push

    # Must run on all nodes including master to collect control-plane logs
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

# THROWAWAY (tm 1f493a81): proves the Loki ruler -> Alertmanager path end to end
# on a test host. Removed in the follow-up commit once verified.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-test
  namespace: monitoring
  labels:
    loki_rule: ""
data:
  allsky-test.yaml: |
    groups:
      - name: allsky-test
        interval: 1m
        rules:
          - alert: AllskyPathTest
            expr: |
              sum(count_over_time({host="allsky-test"} |= "ruler-path-test" [10m])) > 0
            labels:
              severity: warning
              namespace: allsky
            annotations:
              summary: "TEST ONLY: Loki ruler -> Alertmanager path check (tm 1f493a81), ignore"

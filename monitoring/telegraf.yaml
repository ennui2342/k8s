apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telegraf
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf
  namespace: monitoring
data:
  telegraf.conf: |
    [agent]
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      hostname = "$HOSTNAME"
      omit_hostname = false

    [[outputs.influxdb]]
      urls = ["http://influxdb.monitoring.svc:8086"]
      database = "telegraf"
      namedrop = ["nas_cpu", "nas_storage", "nas_network", "nas_diskio"]

    [[outputs.influxdb]]
      urls = ["http://influxdb.monitoring.svc:8086"]
      database = "telegraf"
      retention_policy = "nas_30d"
      namepass = ["nas_cpu", "nas_storage", "nas_network", "nas_diskio"]

    [[inputs.statsd]]
      service_address = ":8125"
      percentiles = [50, 95, 99]
      metric_separator = "_"
      allowed_pending_messages = 10000
      percentile_limit = 1000

    [[inputs.mqtt_consumer]]
      servers = ["tcp://mosquitto.default:1883"]
      topics = ["weather/loop", "solar/foxess"]
      topic_tag = "topic"
      client_id = "telegraf"
      data_format = "json"

    [[processors.regex]]
      namepass = ["prometheus"]
      [[processors.regex.tags]]
        key = "address"
        pattern = "^10\\.42\\.0\\.\\d+$"
        replacement = "k8s"
        result_key = "node"
      [[processors.regex.tags]]
        key = "address"
        pattern = "^10\\.42\\.1\\.\\d+$"
        replacement = "k8s-1"
        result_key = "node"
      [[processors.regex.tags]]
        key = "address"
        pattern = "^10\\.42\\.2\\.\\d+$"
        replacement = "k8s-2"
        result_key = "node"

    [[inputs.snmp]]
      agents = ["udp://192.168.0.76:161"]
      version = 2
      community = "public"
      interval = "60s"
      name = "nas"

      # CPU load per core (%)
      [[inputs.snmp.table]]
        name = "nas_cpu"
        [[inputs.snmp.table.field]]
          name = "load"
          oid = ".1.3.6.1.2.1.25.3.3.1.2"

      # Storage: RAM, swap, disk volumes
      [[inputs.snmp.table]]
        name = "nas_storage"
        [[inputs.snmp.table.field]]
          name = "description"
          oid = ".1.3.6.1.2.1.25.2.3.1.3"
          is_tag = true
        [[inputs.snmp.table.field]]
          name = "allocation_units"
          oid = ".1.3.6.1.2.1.25.2.3.1.4"
        [[inputs.snmp.table.field]]
          name = "size"
          oid = ".1.3.6.1.2.1.25.2.3.1.5"
        [[inputs.snmp.table.field]]
          name = "used"
          oid = ".1.3.6.1.2.1.25.2.3.1.6"

      # Network interface traffic (64-bit counters) and errors
      [[inputs.snmp.table]]
        name = "nas_network"
        [[inputs.snmp.table.field]]
          name = "ifname"
          oid = ".1.3.6.1.2.1.2.2.1.2"
          is_tag = true
        [[inputs.snmp.table.field]]
          name = "bytes_in"
          oid = ".1.3.6.1.2.1.31.1.1.1.6"
        [[inputs.snmp.table.field]]
          name = "bytes_out"
          oid = ".1.3.6.1.2.1.31.1.1.1.10"
        [[inputs.snmp.table.field]]
          name = "errors_in"
          oid = ".1.3.6.1.2.1.2.2.1.14"
        [[inputs.snmp.table.field]]
          name = "errors_out"
          oid = ".1.3.6.1.2.1.2.2.1.20"

      # Physical disk I/O (UCD-DISKIO-MIB) - added 2026-08-23 while
      # investigating repeated NodeHighIOWait alerts (tm task 50cad5c2):
      # nas_cpu/nas_network/nas_storage all confirmed healthy during the
      # alert window, but nothing was collecting the NAS's own disk I/O,
      # so the "NAS's RAID array is IOPS-saturated under concurrent NFS
      # writes" theory couldn't be confirmed or ruled out from telemetry
      # alone - client-side nfsiostat showed huge write queue times
      # (up to ~718ms) that don't map to any single node's local hardware.
      # NOTE: net-snmp doesn't populate diskIOTable by default - the NAS's
      # own /etc/snmp/snmpd.conf needs a `diskio` (or `includeAllDisks`)
      # directive and an snmpd restart, which is NAS-side config outside
      # this repo (like nas-monitor's SSH access, not GitOps-managed). If
      # nas_diskio shows up empty in InfluxDB after this deploys, that's
      # why - not a bug here.
      [[inputs.snmp.table]]
        name = "nas_diskio"
        [[inputs.snmp.table.field]]
          name = "device"
          oid = ".1.3.6.1.4.1.2021.13.15.1.1.2"
          is_tag = true
        [[inputs.snmp.table.field]]
          name = "reads"
          oid = ".1.3.6.1.4.1.2021.13.15.1.1.5"
        [[inputs.snmp.table.field]]
          name = "writes"
          oid = ".1.3.6.1.4.1.2021.13.15.1.1.6"
        [[inputs.snmp.table.field]]
          name = "read_bytes"
          oid = ".1.3.6.1.4.1.2021.13.15.1.1.12"
        [[inputs.snmp.table.field]]
          name = "write_bytes"
          oid = ".1.3.6.1.4.1.2021.13.15.1.1.13"
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - name: statsd
    port: 8125
    targetPort: 8125
    protocol: UDP
  selector:
    app: telegraf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      annotations:
        checksum/config: "2fa0473dd0b6"
      labels:
        app: telegraf
    spec:
      serviceAccountName: telegraf
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
      - name: telegraf
        image: 127.0.0.1:30500/telegraf:1.39.2-patched
        imagePullPolicy: IfNotPresent
        env:
        - name: HOSTNAME
          value: telegraf-polling-service
        volumeMounts:
        - name: config
          mountPath: /etc/telegraf
      volumes:
      - name: config
        configMap:
          name: telegraf

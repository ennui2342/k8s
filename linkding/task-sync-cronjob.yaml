apiVersion: v1
kind: ConfigMap
metadata:
  name: linkding-task-sync-script
  namespace: linkding
data:
  sync.py: |
    import json, subprocess, os, sys
    from urllib.parse import quote

    TM_API = 'http://api.taskmgt.svc.cluster.local:8081'
    LINKDING_API = 'http://linkding.linkding.svc.cluster.local:9090/api'
    LINKDING_TOKEN = os.environ['LINKDING_API_TOKEN']
    LINKDING_TS_HOST = 'https://pinboard.tail611131.ts.net'
    # -task is an imperative "file this" trigger, not a category to keep —
    # once processed it's stripped from the bookmark (see untag_bookmark)
    # so this job never has to re-examine it. That means there's no dedupe
    # or auto-close bookkeeping here: once a tm task exists, its lifecycle
    # belongs entirely to tm.
    TAG = '-task'
    PROVENANCE = '<cli.linkding-task-sync'


    def curl_json(url, *extra_args):
        r = subprocess.run(
            ['curl', '-sf', url, '-H', f'Authorization: Token {LINKDING_TOKEN}', *extra_args],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'curl failed for {url}: {r.stderr[:200]}', file=sys.stderr)
            return None
        try:
            return json.loads(r.stdout)
        except Exception as e:
            print(f'Failed to parse JSON from {url}: {e}', file=sys.stderr)
            return None


    def get_tagged_bookmarks():
        url = f'{LINKDING_API}/bookmarks/?q={quote("#" + TAG)}&limit=100'
        data = curl_json(url)
        if data is None:
            return []
        # Defensive: linkding's search can be fuzzy, confirm the tag is actually present.
        return [b for b in data.get('results', []) if TAG in b.get('tag_names', [])]


    def create_task(text):
        r = subprocess.run(
            ['curl', '-sf', '-X', 'POST', f'{TM_API}/tasks',
             '-H', 'Content-Type: application/json', '-d', json.dumps({'text': text})],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print('tm task creation failed', file=sys.stderr)
            return None
        resp = json.loads(r.stdout)
        print(f'Created task {resp.get("id", "?")}')
        return resp.get('id')


    def untag_bookmark(b, remaining_tags):
        r = subprocess.run(
            ['curl', '-sf', '-X', 'PATCH', f"{LINKDING_API}/bookmarks/{b['id']}/",
             '-H', f'Authorization: Token {LINKDING_TOKEN}',
             '-H', 'Content-Type: application/json',
             '-d', json.dumps({'tag_names': remaining_tags})],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f"Warning: failed to remove {TAG} tag from bookmark {b['id']}", file=sys.stderr)
            return False
        return True


    def build_task_text(b, other_tags):
        title = b.get('title') or b.get('url')
        tag_tokens = ''.join(f' #{t}' for t in other_tags)
        lines = [
            f"{title}{tag_tokens} {PROVENANCE}",
            f"* [Source]({b['url']})",
        ]
        description = (b.get('description') or '').strip()
        if description:
            if len(description) > 300:
                description = description[:300].rstrip() + '...'
            lines.append(f"* {description}")
        lines.append(f"* [View in linkding]({LINKDING_TS_HOST}/bookmarks/{b['id']}/edit)")
        return '\n'.join(lines)


    bookmarks = get_tagged_bookmarks()
    print(f'Bookmarks tagged #{TAG}: {len(bookmarks)}')

    for b in bookmarks:
        # Carry the bookmark's own tags into tm so it can be filed the same
        # way as everything else there — minus the trigger tag itself, so a
        # bookmark with no other categorization produces an untagged task
        # that falls into the inbox view for triage.
        other_tags = [t for t in b.get('tag_names', []) if t != TAG]
        task_id = create_task(build_task_text(b, other_tags))
        if task_id is not None:
            # Only untag on confirmed success — if task creation failed,
            # leave the tag in place so the next run retries it.
            untag_bookmark(b, other_tags)

    print('Done')
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkding-task-sync
  namespace: linkding
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: alpine:latest
              env:
                - name: LINKDING_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: linkding-api-token
                      key: token
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache --quiet python3 curl
                  python3 /scripts/sync.py
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: linkding-task-sync-script

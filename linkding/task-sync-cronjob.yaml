apiVersion: v1
kind: ConfigMap
metadata:
  name: linkding-task-sync-script
  namespace: linkding
data:
  sync.py: |
    import json, subprocess, os, sys
    from urllib.parse import quote

    TM_API = 'http://api.taskmgt.svc.cluster.local:8081'
    LINKDING_API = 'http://linkding.linkding.svc.cluster.local:9090/api'
    LINKDING_TOKEN = os.environ['LINKDING_API_TOKEN']
    TAG = '-task'
    PROVENANCE = '<cli.linkding-task-sync'


    def curl_json(url, *extra_args):
        r = subprocess.run(
            ['curl', '-sf', url, '-H', f'Authorization: Token {LINKDING_TOKEN}', *extra_args],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'curl failed for {url}: {r.stderr[:200]}', file=sys.stderr)
            return None
        try:
            return json.loads(r.stdout)
        except Exception as e:
            print(f'Failed to parse JSON from {url}: {e}', file=sys.stderr)
            return None


    def get_tagged_bookmarks():
        url = f'{LINKDING_API}/bookmarks/?q={quote("#" + TAG)}&limit=100'
        data = curl_json(url)
        if data is None:
            return []
        # Defensive: linkding's search can be fuzzy, confirm the tag is actually present.
        return [b for b in data.get('results', []) if TAG in b.get('tag_names', [])]


    def get_tracked_tasks():
        r = subprocess.run(['curl', '-sf', f'{TM_API}/tasks'], capture_output=True, text=True)
        if r.returncode != 0:
            print('Warning: could not fetch existing tasks from taskmgt', file=sys.stderr)
            return []
        try:
            data = json.loads(r.stdout)
            tasks = data if isinstance(data, list) else data.get('tasks', [])
            return [t for t in tasks if PROVENANCE in t.get('text', '')]
        except Exception as e:
            print(f'Warning: could not parse task list: {e}', file=sys.stderr)
            return []


    def create_task(text):
        r = subprocess.run(
            ['curl', '-sf', '-X', 'POST', f'{TM_API}/tasks',
             '-H', 'Content-Type: application/json', '-d', json.dumps({'text': text})],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print('tm task creation failed', file=sys.stderr)
            return None
        resp = json.loads(r.stdout)
        print(f'Created task {resp.get("id", "?")}')
        return resp.get('id')


    def close_task(task_id, text):
        first, _, rest = text.partition('\n')
        closed_text = f'{first} §closed' + (f'\n{rest}' if rest else '')
        r = subprocess.run(
            ['curl', '-sf', '-X', 'PATCH', f'{TM_API}/tasks/{task_id}',
             '-H', 'Content-Type: application/json', '-d', json.dumps({'text': closed_text})],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'tm task close failed for {task_id}', file=sys.stderr)
            return False
        print(f'Closed task {task_id} (tag removed / bookmark gone)')
        return True


    def bookmark_id_from_text(text):
        # No '#' here: tm's SmartAdd parser treats "#<word>" as a tag token
        # anywhere in the text, so a literal '#' in this marker would get
        # stripped out and turned into a spurious tag instead of staying
        # part of the task name.
        if not text.startswith('[linkding-'):
            return None
        try:
            return int(text.split('[linkding-', 1)[1].split(']', 1)[0])
        except (IndexError, ValueError):
            return None


    bookmarks = get_tagged_bookmarks()
    print(f'Bookmarks tagged #{TAG}: {len(bookmarks)}')

    tracked_tasks = get_tracked_tasks()
    print(f'Existing open/wait linkding-task-sync tasks: {len(tracked_tasks)}')
    tracked_by_bookmark = {bookmark_id_from_text(t['text']): t for t in tracked_tasks}

    # --- Create tasks for newly tagged bookmarks (dedupe on bookmark ID) ---
    current_ids = set()
    for b in bookmarks:
        current_ids.add(b['id'])
        if b['id'] in tracked_by_bookmark:
            continue
        title = b.get('title') or b.get('url')
        text = (
            f"[linkding-{b['id']}] {title} !3 #bookmarks +cli.claude-code.k8s {PROVENANCE}\n"
            f"* {b['url']}"
        )
        create_task(text)

    # --- Auto-close tasks whose bookmark lost the tag or was deleted ---
    for bid, task in tracked_by_bookmark.items():
        if bid is not None and bid not in current_ids:
            close_task(task['id'], task['text'])

    print('Done')
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkding-task-sync
  namespace: linkding
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: alpine:latest
              env:
                - name: LINKDING_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: linkding-api-token
                      key: token
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache --quiet python3 curl
                  python3 /scripts/sync.py
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: linkding-task-sync-script

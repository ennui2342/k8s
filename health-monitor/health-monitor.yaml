apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-monitor-reader
rules:
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: ["kustomizations"]
  verbs: ["get", "list"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-monitor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-monitor-reader
subjects:
- kind: ServiceAccount
  name: health-monitor
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-monitor-script
  namespace: monitoring
data:
  monitor.py: |
    import json, subprocess, os, sys, re, hashlib

    TM_API = 'http://api.taskmgt.svc.cluster.local:8081'
    ALERTMANAGER_API = 'http://kube-prometheus-stack-alertmanager.monitoring.svc:9093/api/v2'
    DISCORD_WEBHOOK = os.environ.get('DISCORD_WEBHOOK', '')

    STATUS_TOKEN_RE = re.compile(r'\s*§\S+')

    def strip_status(text):
        lines = text.split('\n', 1)
        first = STATUS_TOKEN_RE.sub('', lines[0])
        return first if len(lines) == 1 else first + '\n' + lines[1]

    def set_status(text, status):
        return strip_status(text).split('\n', 1)[0] + f' §{status}' + (
            '\n' + text.split('\n', 1)[1] if '\n' in text else ''
        )


    def kubectl_json(*args):
        r = subprocess.run(['kubectl'] + list(args) + ['-o', 'json'],
                           capture_output=True, text=True)
        if r.returncode != 0:
            print(f'kubectl {" ".join(args)} failed: {r.stderr[:200]}', file=sys.stderr)
            return {}
        try:
            return json.loads(r.stdout)
        except Exception as e:
            print(f'Failed to parse kubectl output: {e}', file=sys.stderr)
            return {}


    def get_existing_health_tasks():
        r = subprocess.run(
            ['curl', '-sf', f'{TM_API}/tasks'],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print('Warning: could not fetch existing tasks from taskmgt', file=sys.stderr)
            return []
        try:
            data = json.loads(r.stdout)
            tasks = data if isinstance(data, list) else data.get('tasks', [])
            return [t for t in tasks if '<cli.cluster-health' in t.get('text', '')]
        except Exception as e:
            print(f'Warning: could not parse task list: {e}', file=sys.stderr)
            return []


    def issue_tracked(resource_id, existing_tasks):
        return any(resource_id in t.get('text', '') for t in existing_tasks)


    def find_condition(conditions, ctype):
        return next((c for c in conditions if c['type'] == ctype), None)


    def flux_failure(conditions):
        # Ready == 'False' is an explicit failure. But a genuinely stuck release
        # (retries exhausted) sits at Ready == 'Unknown' forever with a separate
        # Stalled == 'True' condition — Ready alone never flips to False in that
        # case, so it must be checked independently or stuck releases go
        # undetected indefinitely (this is exactly what happened to botkube from
        # 2026-05-09 until manually discovered on 2026-07-23).
        ready = find_condition(conditions, 'Ready')
        stalled = find_condition(conditions, 'Stalled')
        if stalled and stalled.get('status') == 'True':
            return stalled, '!1'  # retries exhausted — won't self-heal, needs a human
        if ready and ready.get('status') == 'False':
            return ready, '!2'
        return None, None


    def create_task(title, notes, priority):
        text = f"{title} {priority} #devops +cli.claude-code.k8s <cli.cluster-health\n{notes}"
        r = subprocess.run(
            ['curl', '-sf', '-X', 'POST', f'{TM_API}/tasks',
             '-H', 'Content-Type: application/json',
             '-d', json.dumps({'text': text})],
            capture_output=True, text=True
        )
        if r.returncode == 0:
            try:
                resp = json.loads(r.stdout)
                print(f'Created task {resp.get("id", "?")} : {title}')
            except Exception:
                print(f'Created task: {title}')
            return True
        print(f'Failed to create task: {title}', file=sys.stderr)
        return False


    def update_task(task_id, text):
        r = subprocess.run(
            ['curl', '-sf', '-X', 'PATCH', f'{TM_API}/tasks/{task_id}',
             '-H', 'Content-Type: application/json', '-d', json.dumps({'text': text})],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'tm task update failed for {task_id}', file=sys.stderr)
            return False
        return True


    issues = []
    existing_tasks = get_existing_health_tasks()
    print(f'Existing cluster-health tasks: {len(existing_tasks)}')

    # --- Flux kustomizations: failed or stalled ---
    data = kubectl_json('get', 'kustomizations.kustomize.toolkit.fluxcd.io', '-A')
    for k in data.get('items', []):
        ns = k['metadata']['namespace']
        name = k['metadata']['name']
        cond, priority = flux_failure(k.get('status', {}).get('conditions', []))
        if cond:
            resource_id = f'kustomization/{name}'
            if issue_tracked(resource_id, existing_tasks):
                print(f'Already tracked: {resource_id}')
                continue
            issues.append({
                'resource': resource_id,
                'title': f'{resource_id}: reconciliation {"stalled" if priority == "!1" else "failed"}',
                'notes': f'* Namespace: {ns}\n* Reason: {cond.get("reason", "")}\n* Message: {cond.get("message", "")[:200]}',
                'priority': priority,
            })

    # --- Flux HelmReleases: failed or stalled ---
    data = kubectl_json('get', 'helmreleases.helm.toolkit.fluxcd.io', '-A')
    for hr in data.get('items', []):
        ns = hr['metadata']['namespace']
        name = hr['metadata']['name']
        cond, priority = flux_failure(hr.get('status', {}).get('conditions', []))
        if cond:
            resource_id = f'helmrelease/{name}'
            if issue_tracked(resource_id, existing_tasks):
                print(f'Already tracked: {resource_id}')
                continue
            issues.append({
                'resource': resource_id,
                'title': f'{resource_id} in {ns}: {"stalled" if priority == "!1" else "failed"}',
                'notes': f'* Namespace: {ns}\n* Reason: {cond.get("reason", "")}\n* Message: {cond.get("message", "")[:200]}',
                'priority': priority,
            })

    # --- Alertmanager bridge ---
    # Prometheus's default kube-prometheus-stack rules already detect most of
    # what this script's own checks above do (and more — e.g. KubeContainerWaiting
    # catches a stuck-Init pod like the cve-scanner job hitting ErrImageNeverPull
    # on 2026-07-27, which none of the checks above would have caught, since
    # they're all pod/node-condition checks, not container-waiting-reason
    # checks), continuously rather than every 30 minutes, using mature
    # community-maintained expressions. But Alertmanager only ever reaches
    # Discord — nothing turned a firing alert into a tracked, worked task, so
    # alerts that fired correctly (confirmed live 2026-07-27: KubeJobFailed
    # firing over 24h with nobody acting on it) just sat as unactioned noise.
    # This bridges that gap without duplicating any detection logic: poll
    # Alertmanager's own alerts, not the cluster directly.
    SKIP_LABELS = {'alertname', 'severity', 'prometheus', 'job', 'instance', 'endpoint', 'service', 'container', 'cluster'}
    SEVERITY_PRIORITY = {'critical': '!1', 'warning': '!2'}

    def alert_fingerprint_marker(fp):
        return f'AlertFingerprint: {fp}'

    r = subprocess.run(
        ['curl', '-sf', '-G', f'{ALERTMANAGER_API}/alerts',
         '--data-urlencode', 'active=true', '--data-urlencode', 'silenced=false',
         '--data-urlencode', 'inhibited=false'],
        capture_output=True, text=True
    )
    active_alerts = []
    if r.returncode != 0:
        print('Warning: could not fetch alerts from Alertmanager', file=sys.stderr)
    else:
        try:
            active_alerts = json.loads(r.stdout)
        except Exception as e:
            print(f'Warning: could not parse Alertmanager response: {e}', file=sys.stderr)

    active_fingerprints = set()
    for alert in active_alerts:
        labels = alert.get('labels', {})
        name = labels.get('alertname', 'unknown')
        if name == 'Watchdog':
            continue
        fp = alert.get('fingerprint', '')
        active_fingerprints.add(fp)
        if issue_tracked(alert_fingerprint_marker(fp), existing_tasks):
            print(f'Already tracked: alert {name} ({fp})')
            continue

        priority = SEVERITY_PRIORITY.get(labels.get('severity', ''), '!3')
        kept_labels = {k: v for k, v in labels.items() if k not in SKIP_LABELS}
        label_str = ', '.join(f'{k}={v}' for k, v in sorted(kept_labels.items()))
        annotations = alert.get('annotations', {})
        summary = annotations.get('summary') or annotations.get('description') or ''

        issues.append({
            'resource': f'alert/{name}',
            'title': f'AlertManager: {name} ({kept_labels.get("namespace", "cluster-wide")})',
            'notes': (
                f'* {summary}\n' if summary else ''
            ) + (
                f'* Labels: {label_str}\n'
                f'* Firing since: {alert.get("startsAt", "unknown")}\n'
                f'* {alert_fingerprint_marker(fp)}'
            ),
            'priority': priority,
        })

    # Close tasks for alerts that stopped firing since they were created —
    # only ones with a fingerprint marker (i.e. bridge-created), so this
    # never touches this script's own kubectl-based checks above.
    closed = []
    for t in existing_tasks:
        if t.get('status') != 'open':
            continue
        m = re.search(r'AlertFingerprint:\s*(\S+)', t.get('text', ''))
        if not m or m.group(1) in active_fingerprints:
            continue
        print(f'Closing {t["id"]}: alert {m.group(1)} no longer firing')
        if update_task(t['id'], set_status(t['text'] + '\n* Resolved: no longer firing in Alertmanager', 'closed')):
            closed.append(t['text'].split('\n', 1)[0])

    created = []
    if issues:
        print(f'Creating {len(issues)} new task(s)...')
        for issue in issues:
            if create_task(issue['title'], issue['notes'], issue['priority']):
                created.append(issue)
    else:
        print('No new cluster health issues detected')

    if (created or closed) and DISCORD_WEBHOOK:
        lines = ['**Cluster Health Monitor**']
        if created:
            lines.append(f'{len(created)} new issue(s):')
            lines.append('```')
            for issue in created:
                lines.append(f"{issue['priority']} {issue['resource']}")
            lines.append('```')
        if closed:
            lines.append(f'{len(closed)} resolved:')
            lines.append('```')
            for title in closed:
                lines.append(f'✅ {title}')
            lines.append('```')
        subprocess.run(
            ['curl', '-sf', '-X', 'POST', DISCORD_WEBHOOK,
             '-H', 'Content-Type: application/json',
             '-d', json.dumps({'username': 'k8s homelab', 'content': '\n'.join(lines)[:2000]})],
            capture_output=True
        )

    print(f'Done: {len(created)} task(s) created, {len(closed)} task(s) closed')
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-health-monitor
  namespace: monitoring
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: health-monitor
          restartPolicy: OnFailure
          containers:
          - name: monitor
            image: 127.0.0.1:30500/k8s-toolbox:1.32.13
            imagePullPolicy: IfNotPresent
            env:
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: address
            command:
            - /bin/sh
            - -c
            - |
              python3 /scripts/monitor.py
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: scripts
            configMap:
              name: health-monitor-script

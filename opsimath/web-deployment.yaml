apiVersion: v1
kind: Service
metadata:
  name: opsimath-web
  namespace: opsimath
spec:
  type: ClusterIP
  selector:
    app: opsimath-web
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsimath-web
  namespace: opsimath
spec:
  replicas: 1
  strategy:
    type: Recreate # storage PVC access, single-writer-at-a-time app expectations
  selector:
    matchLabels:
      app: opsimath-web
  template:
    metadata:
      labels:
        app: opsimath-web
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: opsimath-web
          # Built and pushed by opsimath's own CI (.github/workflows/build.yml)
          # on every push to master; Flux image automation (see
          # flux-system/opsimath-image-automation.yaml) updates this tag
          # automatically - the Setter marker below is what it looks for.
          image: ghcr.io/ennui2342/opsimath:1.20260829.25 # {"$imagepolicy": "flux-system:opsimath"}
          imagePullPolicy: IfNotPresent
          # Default CMD (thrust + rails server) - docker-entrypoint runs
          # `bin/rails db:prepare` automatically whenever the last two args
          # are "./bin/rails server", so this is the one place migrations
          # actually run. Worker deliberately does NOT also call db:prepare
          # (see worker-deployment.yaml's initContainer comment) - the
          # source docker-compose.yml documents a confirmed live race when
          # two processes call it concurrently on a fresh database.
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: opsimath-config
            - secretRef:
                name: opsimath-secrets
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: opsimath-storage

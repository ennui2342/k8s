apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsimath-worker
  namespace: opsimath
spec:
  replicas: 1
  strategy:
    type: Recreate # shares the RWX storage PVC with web, but keep rollout behavior consistent
  selector:
    matchLabels:
      app: opsimath-worker
  template:
    metadata:
      labels:
        app: opsimath-worker
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        # Waits for web's entrypoint (db:prepare, on every "rails server"
        # start) to have created the schema, rather than calling db:prepare
        # itself here too - the source docker-compose.yml documents a
        # confirmed live race (PG::UniqueViolation on CREATE DATABASE) when
        # two processes call db:prepare concurrently against a fresh
        # database. Checking for schema_migrations (created by any
        # db:schema:load/migrate, not Solid Queue-specific) as a simple,
        # universal "schema exists" signal.
        - name: wait-for-schema
          # Same image/tag as the main container below - kept in lockstep via
          # the same Setter marker so this initContainer (just running
          # psql/pg_isready from the app image) never drifts from what
          # actually ships.
          image: ghcr.io/ennui2342/opsimath:1.20260903.57 # {"$imagepolicy": "flux-system:opsimath"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: opsimath-config
            - secretRef:
                name: opsimath-secrets
          command:
            - bash
            - -c
            - |
              until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U app \
                && PGPASSWORD="$APP_DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -U app -d app_production \
                     -c 'SELECT 1 FROM schema_migrations LIMIT 1' > /dev/null 2>&1; do
                echo 'Waiting for db schema (opsimath-web runs db:prepare on startup)...'
                sleep 3
              done
      containers:
        - name: opsimath-worker
          # Built and pushed by opsimath's own CI (.github/workflows/build.yml)
          # on every push to master; Flux image automation (see
          # flux-system/opsimath-image-automation.yaml) updates this tag
          # automatically - the Setter marker below is what it looks for.
          image: ghcr.io/ennui2342/opsimath:1.20260903.57 # {"$imagepolicy": "flux-system:opsimath"}
          imagePullPolicy: IfNotPresent
          command: ["./bin/rails", "solid_queue:start"]
          envFrom:
            - configMapRef:
                name: opsimath-config
            - secretRef:
                name: opsimath-secrets
          volumeMounts:
            # Goodreads sync (GoodreadsSyncJob, runs via Solid Queue) attaches
            # cover images - the worker needs write access to the same
            # storage directory as web, not just read access.
            - name: storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              # 256Mi undershot even idle usage (measured 310Mi live,
              # 2026-08-06) - bumped to give real headroom above steady-state,
              # not just chase the OOM below.
              memory: 384Mi
            limits:
              # Confirmed live 2026-08-06: OOM-killed a Solid Queue worker
              # subprocess at 512Mi during bulk ISFDB enrichment (~1,700 cover
              # images downloaded + Active-Storage-analyzed) - tm task a797e567.
              # 1.5Gi, not just the ticket's suggested 1Gi floor: real headroom
              # exists on every node (3-4GB free, kubectl top nodes), this is
              # a fundamentally heavier batch-processing workload than web's
              # already-larger 768Mi, and a tighter number risks hitting the
              # same wall later in the same ~1,078-edition remaining batch if
              # usage grows gradually rather than staying flat per-edition.
              memory: 1536Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: opsimath-storage

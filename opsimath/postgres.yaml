apiVersion: v1
kind: Service
metadata:
  name: opsimath-db
  namespace: opsimath
spec:
  clusterIP: None
  selector:
    app: opsimath-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opsimath-db
  namespace: opsimath
spec:
  serviceName: opsimath-db
  replicas: 1
  selector:
    matchLabels:
      app: opsimath-db
  template:
    metadata:
      labels:
        app: opsimath-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: postgres
          # Locally patched fork — postgres:18.6-trixie (rebased from postgres:18,
          # which had resolved to 18.4-1.pgdg13+1) plus an apt upgrade closing
          # CVE-2026-53615 (libblkid integer overflow, HIGH), which upstream's
          # 18.6-trixie tag doesn't yet include even though the fix is already
          # published to trixie-security. See trivy/patched-images.yaml and
          # trivy/patched-images/postgres/Dockerfile.
          image: 127.0.0.1:30500/postgres:18.6-trixie-patched
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # config/database.yml's production block hardcodes username: app
            # (not configurable via DATABASE_USERNAME) - the role name here
            # must match exactly.
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsimath-secrets
                  key: APP_DATABASE_PASSWORD
            # No POSTGRES_DB set deliberately - config/database.yml's
            # production block defines 4 separate databases on this one
            # role (app_production, _cache, _queue, _cable), all created by
            # bin/rails db:prepare (web's entrypoint runs this on every
            # start) rather than by this StatefulSet. The POSTGRES_USER
            # role has CREATEDB rights by default in this image, which is
            # all db:prepare needs.
          volumeMounts:
            # Postgres 18's official image changed convention: it wants a
            # single mount at /var/lib/postgresql (manages its own
            # version-specific subdirectory), not .../postgresql/data -
            # confirmed in opsimath's own docker-compose.yml comment
            # (a real failed boot before that fix). Matching it here.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            # -d app_production avoids pg_isready's default of connecting to a
            # database named after -U (i.e. "app", which doesn't exist here -
            # see the POSTGRES_DB comment above) - that produced a real
            # connection attempt logged as FATAL: database "app" does not
            # exist every 5s/10s forever (noticed live 2026-08-19 while
            # smoke-testing the CVE-2026-53615 patch above; pg_isready still
            # reported "accepting connections" and readiness/liveness were
            # never actually affected, but the log spam was needless and
            # this is the exact file already being touched for that patch).
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app_production"]
            initialDelaySeconds: 5
            periodSeconds: 5
            # Default timeoutSeconds (1s, unset before 2026-08-19) was too
            # tight - confirmed live via recurring "command timed out:
            # pg_isready ... timed out after 1s" kubelet events on k8s-2
            # (tm aed646fc), tripping restarts on transient slowness alone,
            # independent of the separate node/containerd setns issue also
            # observed on that node. 5s gives real headroom under NFS-backed
            # I/O load without meaningfully delaying detection of a truly
            # wedged Postgres.
            #
            # Bumped again to 15s/failureThreshold 6 on 2026-08-22: after a
            # full cluster hard-reboot, k8s-1's load stayed pinned at ~19-20
            # for 2+ hours in a self-reinforcing restart loop - kubelet's own
            # exec probes were failing with "OCI runtime exec failed ...
            # error executing setns process: exit status 1" (a node-level
            # containerd/runc symptom of an overloaded node, not a Postgres
            # problem - the DB's own logs showed healthy uninterrupted
            # checkpoints the whole time). Every probe-triggered restart
            # forced fresh Postgres startup + kube-prometheus-stack's
            # Prometheus (same node, same symptom, same night) to redo WAL
            # replay/compaction, which itself is expensive enough on this
            # node's NFS-backed storage to keep the node overloaded - each
            # "unhealthy" kill was making the actual cause worse. 5s still
            # weathered the earlier CVE-fix-era slowness fine; this specific
            # incident needed more.
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app_production"]
            # Bumped 30s -> 300s 2026-08-26: confirmed live that the postgres
            # entrypoint's own `find $PGDATA ! -user postgres -exec chown
            # postgres {} +` (a one-time ownership fixup, runs before postgres
            # itself is even started - zero log output during it, which is
            # normal, not a symptom) was still running in "D" state
            # (uninterruptible I/O wait) well past the old 30s+6*15s=~120s
            # liveness budget, every single restart, during heavy NFS
            # contention from same-day back-to-back k8s-1/k8s-2 card swaps -
            # 9 restarts in a row, never once reaching postgres startup itself.
            # This is a one-time-per-boot cost, not steady-state health
            # checking, so the fix is a much bigger initialDelaySeconds
            # specifically (not periodSeconds/timeoutSeconds/failureThreshold,
            # which still matter once postgres is actually up).
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 10Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mg-reporting-worker
  namespace: mg-reporting
spec:
  # Was 0 at first deploy (tm ab70cca6) until the production database was
  # loaded from dev (tm 05600a16, 2026-11-11). Only ever 1: a single Solid
  # Queue supervisor owns the recurring schedule.
  replicas: 1
  strategy:
    type: Recreate # single Solid Queue supervisor; never two at once
  selector:
    matchLabels:
      app: mg-reporting-worker
  template:
    metadata:
      labels:
        app: mg-reporting-worker
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Private GHCR image (commercially sensitive repo) - unlike opsimath/
      # taskmgt, this needs a pull secret. Read-only PAT (read:packages).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mg-reporting-worker
          # Built and pushed by mg-reporting's own CI (.github/workflows/build.yml);
          # Flux image automation (flux-system/mg-reporting-image-automation.yaml)
          # updates this tag via the Setter marker below.
          image: ghcr.io/ennui2342/mg-reporting:1.20261111.3 # {"$imagepolicy": "flux-system:mg-reporting"}
          imagePullPolicy: IfNotPresent
          # The image's entrypoint (/rails/bin/docker-entrypoint) runs
          # db:prepare first when the command is bin/jobs - there is no web
          # Deployment, so this single replica is the only process that ever
          # runs it (no CREATE DATABASE race, no wait-for-schema
          # initContainer needed).
          #
          # `args`, NOT `command`: in Kubernetes `command` replaces the
          # image's ENTRYPOINT, which would skip docker-entrypoint and so
          # skip db:prepare. `args` replaces only CMD, so the entrypoint
          # still runs and execs bin/jobs.
          args: ["bin/jobs"]
          envFrom:
            - configMapRef:
                name: mg-reporting-config
            - secretRef:
                name: mg-reporting-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi

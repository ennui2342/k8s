apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - predbat-secret.yaml      # predbat-secrets: secrets.yaml (ha_key = HA long-lived token 'predbat', web_password), SOPS
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  # apps.yaml is version-controlled in github.com/ennui2342/home-energy (predbat/apps.yaml),
  # which is the source of truth; this is a copy. Hash-suffixed name, so an edit here rolls the pod.
  - name: predbat-apps
    files:
      - apps.yaml

# Predbat web UI (plan, history, tariff comparison). Internal only (LAN/Tailscale Split DNS):
# k3s Traefik's default web/websecure entry points, never public/publictls: the UI can change
# Predbat's settings, including select.predbat_mode, and Predbat is IN CONTROL of the inverter
# (since 2026-11-25). Its login (apps.yaml web_username/web_password) is only HTTP Basic auth,
# so it must never travel over plain HTTP (tm 3d46c670):
#   - `predbat` serves the UI on websecure only (Traefik's default self-signed cert; no real cert
#     exists for *.k8s.ecafe.org, which is internal DNS only);
#   - `predbat-http-redirect` answers on web and only redirects to https:// (never proxies).
# Predbat sends no HSTS header, so the opsimath HSTS/Secure-cookie trap (opsimath/ingress.yaml)
# doesn't apply. Redirect is non-permanent (302) so it can be reverted without browser caches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predbat
  namespace: home-assistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: predbat.k8s.ecafe.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: predbat
                port:
                  number: 5052
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: predbat-https-redirect
  namespace: home-assistant
spec:
  redirectScheme:
    scheme: https
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predbat-http-redirect
  namespace: home-assistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: home-assistant-predbat-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: predbat.k8s.ecafe.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Never reached (the middleware redirects first); required by the Ingress schema.
              service:
                name: predbat
                port:
                  number: 5052

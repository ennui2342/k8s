apiVersion: v1
kind: ConfigMap
metadata:
  name: freshrss-php-security
  namespace: freshrss
data:
  # Mounted into the Apache mod_php SAPI's conf.d (php.ini level, loaded before
  # request parsing; ini_set()/.user.ini would be too late). PHP advisory
  # 2026-10-23: CVE-2026-115560 in session upload progress affects even the
  # PHP2Shell-patched releases (8.4.27); keep it off until the next PHP bugfix
  # release, and probably after: FreshRSS doesn't use it.
  99-security.ini: |
    session.upload_progress.enabled = 0

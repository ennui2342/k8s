apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # You must replace this email address with your own.
    # Let's Encrypt will use this to contact you about expiring
    # certificates, and issues related to your account.
    email: mark.cheverton@ecafe.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # Secret resource that will be used to store the account's private key.
      name: letsencrypt-prod
    # Add a single challenge solver, HTTP01 using nginx
    solvers:
    - http01:
        ingress:
          class: traefik
          # The solver Ingress must be on "public" (the internet-facing entry
          # point the router's port-80 forward reaches, see
          # traefik/helmchartconfig.yaml) for Let's Encrypt, AND on "web" for
          # cert-manager's own in-cluster self-check. Without this it would
          # only get the asDefault entry points (web, websecure).
          ingressTemplate:
            metadata:
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: web,public

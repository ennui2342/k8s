apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      # Pinned to the current minor line, not a wide "v1.x.x" range - confirmed live
      # 2026-07-30: an unpinned range let Flux auto-upgrade this HelmRelease
      # (v1.21.0 -> v1.21.1) with zero review, same class of risk task 0fcc5a38
      # already flagged for this exact chart. Patch releases still auto-apply
      # within this line; a minor/major bump needs a deliberate, reviewed pass -
      # see tm task for the tracked follow-up.
      version: "v1.21.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  values:
    installCRDs: true

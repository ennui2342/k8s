---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opsimath
  namespace: flux-system
spec:
  interval: 1h
  suspend: true  # TEMPORARY 2026-09-06: opsimath-db PV migration + probe-loop firefight; remove to resume
  retryInterval: 5m
  path: ./opsimath
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: nfs

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librarium
  namespace: librarium
spec:
  ingressClassName: traefik
  rules:
    - host: librarium.k8s.ecafe.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librarium-web
                port:
                  number: 3000

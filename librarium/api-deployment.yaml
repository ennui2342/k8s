apiVersion: v1
kind: Service
metadata:
  name: librarium-api
  namespace: librarium
spec:
  type: ClusterIP
  selector:
    app: librarium-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librarium-api
  namespace: librarium
spec:
  replicas: 1
  strategy:
    type: Recreate  # cover and media PVCs are RWO; can't run two pods at once
  selector:
    matchLabels:
      app: librarium-api
  template:
    metadata:
      labels:
        app: librarium-api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: librarium-api
          # Locally-built fork image (PRs #45/#46 not yet merged upstream) — see
          # RUNBOOK.md "Librarium local fork images" for the build/push steps
          # and revert-to-upstream instructions once those PRs land.
          image: 127.0.0.1:30500/librarium-api:1.20260803.1806
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: librarium-config
            - secretRef:
                name: librarium-secrets
          volumeMounts:
            - name: covers
              mountPath: /data/covers
            - name: media
              mountPath: /data/media
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: covers
          persistentVolumeClaim:
            claimName: librarium-covers
        - name: media
          persistentVolumeClaim:
            claimName: librarium-media

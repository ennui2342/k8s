apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: epigone
  namespace: epigone
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`epigone.ecafe.org`) && PathPrefix(`/webdav`)
      kind: Rule
      priority: 100
      middlewares:
        - name: webdav-strip-prefix
          namespace: default
      services:
        - name: webdav
          namespace: default
          port: 6065
    - match: Host(`epigone.ecafe.org`)
      kind: Rule
      services:
        - name: homeassistant-service
          namespace: home-assistant
          port: 8123
  tls:
    secretName: epigone.ecafe.org-production

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Flux entrypoint (the flux-system Kustomization reconciles `./`).
# Every app is now reconciled by its own Flux Kustomization — see kustomizations/
# (tm 9db56d2e). This root only wires in the Flux system objects and those
# per-app Kustomization CRs; it deliberately does NOT list the app directories.
resources:
  - flux-system/
  - kustomizations/

# Tracks every workload currently running a custom-forked image instead of a
# plain upstream tag, so the CVE scanner can:
#   1. suppress duplicate per-CVE nagging for images already known to be forked
#   2. periodically re-scan the *upstream* image and detect when maintainers
#      ship an equivalent fix, so we can revert instead of re-patching forever
#
# strategy: frozen-rebuild — a one-off custom image built with `docker build`
#   locally and imported into node containerd (imagePullPolicy: Never). Has a
#   Dockerfile under trivy/patched-images/<name>/. Reverting means switching
#   the manifest back to `upstream_image` and deleting the Dockerfile + this
#   entry.
# strategy: live-upgrade — the manifest runs a plain upstream image but
#   upgrades OS packages live at every pod/container start. No separate
#   patched_image or Dockerfile. Reverting means removing the live-upgrade
#   command and going back to the image's normal entrypoint, once upstream no
#   longer needs it. No current workload uses this strategy — health-monitor
#   was the last one, migrated to the shared k8s-toolbox frozen-tag image
#   (127.0.0.1:30500/k8s-toolbox, see CLAUDE.md's "Monitoring & Alerting")
#   2026-07-27, which is scanned/rebuilt directly and isn't tracked here.
# strategy: deferred-migration — the base OS is EOL (no CVE fix will ever
#   ship); the real fix is an application-level version migration, not a CVE
#   patch. `patched_image` is set to the plain image ref currently deployed
#   (so the suppression match works the same way), `upstream_image` is null
#   (nothing to reconcile against — there's no upstream fix to wait for).
#   See the linked tm task for the actual migration project.
#
# critical/high are the CRITICAL+HIGH counts resolved at patch time — the
# reconciliation scan compares the *current* upstream scan against these as
# the bar upstream needs to clear (equal or better) before we revert.


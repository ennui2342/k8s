apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: default
  labels:
    app: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-26T00:00:00Z"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
      - name: syncthing
        # Frozen-rebuild fork of lscr.io/linuxserver/syncthing:v2.1.3-ls228
        # (was the floating :latest tag). apk-upgraded on the same Alpine 3.23
        # base to resolve CVE-2026-14456 (openssl 3.5.7-r0 -> 3.5.8-r0) — no
        # newer LinuxServer -lsNNN build has shipped the fix.
        # See trivy/patched-images.yaml + trivy/patched-images/syncthing/.
        image: 127.0.0.1:30500/syncthing:2.1.3-ls228-patched
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/London
        - name: PUID
          value: "911"
        - name: PGID
          value: "911"
        ports:
        - name: web-ui
          containerPort: 8384
          protocol: TCP
        - name: sync-tcp
          containerPort: 22000
          protocol: TCP
        - name: sync-udp
          containerPort: 22000
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: syncthing-config-pvc
      - name: data
        persistentVolumeClaim:
          claimName: syncthing-data-pvc

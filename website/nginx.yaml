apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: nginx
  serviceName: "nginx"
  replicas: 1
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        checksum/config: "67b9205b25ed"
        checksum/phpconfig: "4b582f2a3f10"
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: nginx
          image: 127.0.0.1:30500/nginx:1.31.3-trixie-patched
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 80
            name: web
          volumeMounts:
          - name: web-data
            mountPath: /usr/share/nginx/html
          - name: nginx-config-volume
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          - name: ddns-config-volume
            mountPath: /etc/nginx/conf.d/ddns.conf
            subPath: ddns.conf
        - name: php
          # PHP 8.4 since 2026-10-24 (was php:7.0-fpm, EOL; PHP2Shell CVE-2026-109618/-109619
          # fixed in 8.4.27). Fork of php:8.4.27-fpm, see trivy/patched-images/php-fpm/.
          image: 127.0.0.1:30500/php:8.4.27-fpm-patched-20261024
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 9000
          volumeMounts:
          - name: web-data
            mountPath: /var/www/html
          - name: php-ini-volume
            mountPath: /usr/local/etc/php/conf.d/zz-website.ini
            subPath: zz-website.ini
            readOnly: true
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: ddns-config-volume
          configMap:
            name: ddns-config
        - name: php-ini-volume
          configMap:
            name: php-ini
  volumeClaimTemplates:
  - metadata:
      name: web-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nfs-client"
      resources:
        requests:
          storage: 1Gi

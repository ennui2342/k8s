apiVersion: v1
kind: ConfigMap
metadata:
  name: php-ini
  namespace: default
data:
  # Mounted into the php container as conf.d/zz-website.ini, layered over the
  # image's built-in defaults (the official php images ship no php.ini, so
  # display_errors would otherwise be On and leak notices into pages). Replaced
  # 2026-10-24 a full 2017-era PHP 7 php.ini that was never actually mounted.
  zz-website.ini: |
    display_errors = Off
    display_startup_errors = Off
    log_errors = On
    error_log = /proc/self/fd/2
    expose_php = Off
    ; PHP advisory 2026-10-23: CVE-2026-115560 in session upload progress affects even
    ; PHP2Shell-patched 8.4.27. Off until the next PHP bugfix release (the site doesn't use it).
    session.upload_progress.enabled = 0

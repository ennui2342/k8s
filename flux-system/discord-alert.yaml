---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: k8s homelab
  secretRef:
    name: discord-webhook  # created manually: kubectl create secret generic discord-webhook -n flux-system --from-literal=address=<webhook-url>
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: discord
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventMetadata:
    summary: "k8s homelab"
  eventSeverity: info
  # Suppresses routine chatter that isn't actionable:
  #  - "artifact up-to-date" / "stored fetched index of size": HelmRepository index-fetch
  #    polling (ArtifactUpToDate on every no-change poll is the dominant noise source;
  #    NewArtifact on an upstream publish still isn't actionable since every HelmRelease
  #    here is pinned to a specific minor line). Confirmed live 2026-08-21 these are the
  #    only two HelmRepository event reasons seen.
  #  - "stored artifact for commit": the GitRepository's per-commit "a push landed" event.
  #    It's repo-wide and never names which app changed, and the Kustomization's own
  #    "Applied revision" event right after it already means "the deploy happened" (per-app
  #    once tm 9db56d2e lands). GitRepository *failures* (clone/auth/checkout) use different
  #    wording and still come through - this only drops the success line.
  # None of these match eventSeverity: error, which stays info deliberately (see the
  # HelmRelease/HelmRepository comment below) - real failures use different message text.
  exclusionList:
    - "^artifact up-to-date with remote revision:"
    - "^stored fetched index of size"
    - "^stored artifact for commit"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    # HelmRelease/HelmRepository failures were previously invisible: the only
    # eventSource watched was the single flux-system Kustomization, whose own
    # Ready status doesn't reflect whether the HelmReleases it creates actually
    # converge (see botkube's HelmRelease, stalled since 2026-05-09 with zero
    # alert). One entry per namespace is required — eventSources has no
    # cluster-wide wildcard, only per-namespace name:"*".
    - kind: HelmRelease
      name: "*"
      namespace: botkube
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRepository
      name: "*"
      namespace: botkube
    - kind: HelmRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRepository
      name: "*"
      namespace: monitoring
    - kind: HelmRepository
      name: "*"
      namespace: tailscale

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: k8s homelab
  secretRef:
    name: discord-webhook  # created manually: kubectl create secret generic discord-webhook -n flux-system --from-literal=address=<webhook-url>
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: discord
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventMetadata:
    summary: "k8s homelab"
  eventSeverity: info
  # Suppresses routine HelmRepository index-fetch chatter (ArtifactUpToDate fires on every
  # poll where nothing changed - the dominant source of noise; NewArtifact fires whenever
  # upstream actually publishes something, still not actionable on its own since every
  # HelmRelease here is pinned to a specific minor line - a new index doesn't mean anything
  # gets deployed). Confirmed live 2026-08-21 these are the only two HelmRepository event
  # reasons seen; GitRepository uses different message wording ("no changes since last
  # reconciliation"), so this doesn't bleed into git-sync visibility. Real HelmRepository/
  # HelmRelease failures use different message text and still come through - this only
  # matches the two specific "nothing to see here" patterns, not eventSeverity: error more
  # broadly (which stays info deliberately, see the HelmRelease/HelmRepository comment below).
  exclusionList:
    - "^artifact up-to-date with remote revision:"
    - "^stored fetched index of size"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    # HelmRelease/HelmRepository failures were previously invisible: the only
    # eventSource watched was the single flux-system Kustomization, whose own
    # Ready status doesn't reflect whether the HelmReleases it creates actually
    # converge (see botkube's HelmRelease, stalled since 2026-05-09 with zero
    # alert). One entry per namespace is required — eventSources has no
    # cluster-wide wildcard, only per-namespace name:"*".
    - kind: HelmRelease
      name: "*"
      namespace: botkube
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRepository
      name: "*"
      namespace: botkube
    - kind: HelmRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRepository
      name: "*"
      namespace: monitoring
    - kind: HelmRepository
      name: "*"
      namespace: tailscale

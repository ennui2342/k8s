---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: k8s homelab
  secretRef:
    name: discord-webhook  # created manually: kubectl create secret generic discord-webhook -n flux-system --from-literal=address=<webhook-url>
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: discord
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventMetadata:
    summary: "k8s homelab"
  eventSeverity: info
  # Suppresses routine chatter that isn't actionable:
  #  - "artifact up-to-date" / "stored fetched index of size": HelmRepository index-fetch
  #    polling (ArtifactUpToDate on every no-change poll is the dominant noise source;
  #    NewArtifact on an upstream publish still isn't actionable since every HelmRelease
  #    here is pinned to a specific minor line). Confirmed live 2026-08-21 these are the
  #    only two HelmRepository event reasons seen.
  #  - "stored artifact for commit": the GitRepository's per-commit "a push landed" event.
  #    It's repo-wide and never names which app changed, and the Kustomization's own
  #    "configured" event already names what actually deployed. GitRepository *failures*
  #    (clone/auth/checkout) use different wording and still come through.
  #  - "Reconciliation finished in Xs": the per-Kustomization success heartbeat, emitted on
  #    every reconcile whether or not anything changed. Harmless with one Kustomization,
  #    but with the per-app Kustomizations (tm 9db56d2e) every git push fires ~30 of these
  #    ("no changes" for every app the commit didn't touch) and Discord rate-limits. A
  #    reconcile that *did* change something still emits a separate "<obj> configured"
  #    event, which is not excluded - that's the per-app deploy line we want to keep.
  #  - "Dependencies do not meet ready condition": transient dependsOn resolution chatter.
  #    A genuinely stuck Kustomization/dependency is caught by health-monitor (Flux
  #    failed-or-stalled check -> tm task), not something Discord needs to page on.
  # None of these match eventSeverity: error - real failures ("Reconciliation failed after",
  # "build failed", "Health check failed", ...) use different message text and still come through.
  exclusionList:
    - "^artifact up-to-date with remote revision:"
    - "^stored fetched index of size"
    - "^stored artifact for commit"
    - "^Reconciliation finished in"
    - "^Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    # HelmRelease/HelmRepository failures were previously invisible: the only
    # eventSource watched was the single flux-system Kustomization, whose own
    # Ready status doesn't reflect whether the HelmReleases it creates actually
    # converge (see botkube's HelmRelease, stalled since 2026-05-09 with zero
    # alert). One entry per namespace is required — eventSources has no
    # cluster-wide wildcard, only per-namespace name:"*".
    - kind: HelmRelease
      name: "*"
      namespace: botkube
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRepository
      name: "*"
      namespace: botkube
    - kind: HelmRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRepository
      name: "*"
      namespace: monitoring
    - kind: HelmRepository
      name: "*"
      namespace: tailscale

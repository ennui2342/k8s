apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- taskmgt-image-automation.yaml
- opsimath-image-automation.yaml
- discord-alert.yaml
- discord-webhook-secret.yaml
patches:
- path: gotk-patches.yaml
  target:
    kind: Deployment
    name: kustomize-controller
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: placeholder
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
  target:
    kind: Deployment
- patch: |
    - op: add
      path: /spec/decryption
      value:
        provider: sops
        secretRef:
          name: sops-age
  target:
    kind: Kustomization
    name: flux-system
# Transitional (tm 9db56d2e, phase 2): the flux-system Kustomization no longer
# builds the app directories — each is owned by its own Kustomization in
# kustomizations/. prune: false keeps flux-system from garbage-collecting those
# now-out-of-scope resources during the ownership handover. Removed again in
# phase 3 once every app resource carries its per-app owner label, at which point
# flux-system only manages flux-system/ + kustomizations/ and prune is safe.
- patch: |
    - op: replace
      path: /spec/prune
      value: false
  target:
    kind: Kustomization
    name: flux-system

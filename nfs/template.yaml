# Source: nfs-subdir-external-provisioner/templates/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  labels:
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    app: nfs-subdir-external-provisioner
    release: nfs-subdir-external-provisioner
  name: nfs-client
  annotations:
provisioner: cluster.local/nfs-subdir-external-provisioner
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  # "true" (not the chart default "false"): on PVC delete the provisioner
  # renames the backing NAS dir to archived-<name> instead of rm -rf'ing it.
  # Blanket safety net after the 2026-09-06 prune incident wiped several
  # dynamic Delete-policy PV dirs (tm 9db56d2e / ee653d77). The important
  # datastores are on static Retain PVs now; this covers the rest
  # (loki/prometheus/grafana/trivy-cache + any future dynamic PVC).
  # NOTE: StorageClass parameters are immutable - changing this needs
  # `kubectl delete sc nfs-client` + a Flux reconcile of the nfs Kustomization
  # to recreate it (safe: existing bound volumes don't re-read SC params).
  archiveOnDelete: "true"
---
